<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="30" fill="#10233f">Tirinha autoral.</text><rect x="60" y="105" width="526" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="323" y="145" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Quadro 1</text><circle cx="138" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="138" y1="424" x2="138" y2="535" stroke="#10233f" stroke-width="6"/><line x1="138" y1="455" x2="95" y2="500" stroke="#10233f" stroke-width="5"/><line x1="138" y1="455" x2="180" y2="500" stroke="#10233f" stroke-width="5"/><rect x="185" y="205" width="376" height="175" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M210 380 L190 420 L255 380" fill="white" stroke="#2563eb" stroke-width="3"/><text x="373" y="250" text-anchor="middle" font-family="Arial" font-size="19"><tspan x="373" dy="0">Estudante: “Que desastre!</tspan><tspan x="373" dy="25">Sem internet, estou</tspan><tspan x="373" dy="25">desconectada do mundo.”</tspan></text><text x="323" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569"><tspan x="323" dy="0">Sala escura durante uma queda de</tspan><tspan x="323" dy="25">energia; estudante olha para o</tspan><tspan x="323" dy="25">celular sem sinal.</tspan></text><rect x="614" y="105" width="526" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="877" y="145" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Quadro 2</text><circle cx="692" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="692" y1="424" x2="692" y2="535" stroke="#10233f" stroke-width="6"/><line x1="692" y1="455" x2="649" y2="500" stroke="#10233f" stroke-width="5"/><line x1="692" y1="455" x2="734" y2="500" stroke="#10233f" stroke-width="5"/><rect x="739" y="205" width="376" height="175" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M764 380 L744 420 L809 380" fill="white" stroke="#2563eb" stroke-width="3"/><text x="927" y="250" text-anchor="middle" font-family="Arial" font-size="19"><tspan x="927" dy="0">Avó: “Ótimo. Então vamos nos</tspan><tspan x="927" dy="25">conectar aqui na sala.”</tspan></text><text x="877" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569"><tspan x="877" dy="0">A avó acende uma lanterna e se</tspan><tspan x="877" dy="25">senta ao lado da estudante.</tspan></text></svg>