<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="600" y="36" text-anchor="middle" font-family="Arial" font-size="28" font-weight="normal" fill="#10233f"><tspan x="600" dy="0">Percurso simplificado de materiais do interior serrano</tspan><tspan x="600" dy="31">capixaba até a planície litorânea.</tspan></text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker></defs><rect x="230" y="115" width="740" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="370" y="175" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#10233f"><tspan x="370" dy="0">Planalto serrano</tspan></text><text x="690" y="164" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#334155"><tspan x="690" dy="0">Área elevada do interior do Espírito Santo, onde</tspan><tspan x="690" dy="23">se originam cursos d’água.</tspan></text><line x1="600" y1="235" x2="600" y2="249" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/><text x="780" y="244" text-anchor="middle" font-family="Arial" font-size="14" font-weight="normal" fill="#7c2d12"><tspan x="780" dy="0">escoamento</tspan></text><rect x="230" y="253" width="740" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="370" y="313" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#10233f"><tspan x="370" dy="0">Rios de maior declive</tspan></text><text x="690" y="302" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#334155"><tspan x="690" dy="0">Trechos com fluxo mais energético, capazes de</tspan><tspan x="690" dy="23">transportar materiais.</tspan></text><line x1="600" y1="373" x2="600" y2="387" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/><text x="780" y="382" text-anchor="middle" font-family="Arial" font-size="14" font-weight="normal" fill="#7c2d12"><tspan x="780" dy="0">transporte</tspan></text><rect x="230" y="391" width="740" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="370" y="451" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#10233f"><tspan x="370" dy="0">Vales do interior</tspan></text><text x="690" y="440" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#334155"><tspan x="690" dy="0">Corredores rebaixados que conduzem a drenagem em</tspan><tspan x="690" dy="23">direção ao litoral.</tspan></text><line x1="600" y1="511" x2="600" y2="525" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/><text x="780" y="520" text-anchor="middle" font-family="Arial" font-size="14" font-weight="normal" fill="#7c2d12"><tspan x="780" dy="0">deposição</tspan></text><rect x="230" y="529" width="740" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="370" y="589" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#10233f"><tspan x="370" dy="0">Planície litorânea</tspan></text><text x="690" y="578" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#334155"><tspan x="690" dy="0">Área baixa próxima ao oceano, com menor</tspan><tspan x="690" dy="23">declividade e acúmulo sedimentar.</tspan></text></svg>