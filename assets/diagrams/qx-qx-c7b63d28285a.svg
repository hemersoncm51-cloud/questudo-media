<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="30" fill="#10233f">Tirinha autoral.</text><rect x="60" y="105" width="341" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="231" y="145" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Quadro 1</text><circle cx="138" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="138" y1="424" x2="138" y2="535" stroke="#10233f" stroke-width="6"/><line x1="138" y1="455" x2="95" y2="500" stroke="#10233f" stroke-width="5"/><line x1="138" y1="455" x2="180" y2="500" stroke="#10233f" stroke-width="5"/><rect x="185" y="205" width="191" height="175" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M210 380 L190 420 L255 380" fill="white" stroke="#2563eb" stroke-width="3"/><text x="281" y="250" text-anchor="middle" font-family="Arial" font-size="19"><tspan x="281" dy="0">Moradora: “A partir de hoje,</tspan><tspan x="281" dy="25">vou economizar água.”</tspan></text><text x="231" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569"><tspan x="231" dy="0">No corredor do condomínio, há um</tspan><tspan x="231" dy="25">cartaz com a frase “Cada gota</tspan><tspan x="231" dy="25">conta”.</tspan></text><rect x="429" y="105" width="341" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="600" y="145" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Quadro 2</text><circle cx="507" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="507" y1="424" x2="507" y2="535" stroke="#10233f" stroke-width="6"/><line x1="507" y1="455" x2="464" y2="500" stroke="#10233f" stroke-width="5"/><line x1="507" y1="455" x2="549" y2="500" stroke="#10233f" stroke-width="5"/><rect x="554" y="205" width="191" height="175" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M579 380 L559 420 L624 380" fill="white" stroke="#2563eb" stroke-width="3"/><text x="650" y="250" text-anchor="middle" font-family="Arial" font-size="19"><tspan x="650" dy="0">Moradora: “Pequenas atitudes</tspan><tspan x="650" dy="25">fazem diferença.”</tspan></text><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569"><tspan x="600" dy="0">Na cozinha, a moradora coloca um</tspan><tspan x="600" dy="25">copo sob a torneira.</tspan></text><rect x="799" y="105" width="341" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="969" y="145" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">Quadro 3</text><circle cx="877" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="877" y1="424" x2="877" y2="535" stroke="#10233f" stroke-width="6"/><line x1="877" y1="455" x2="834" y2="500" stroke="#10233f" stroke-width="5"/><line x1="877" y1="455" x2="919" y2="500" stroke="#10233f" stroke-width="5"/><rect x="924" y="205" width="191" height="175" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M949 380 L929 420 L994 380" fill="white" stroke="#2563eb" stroke-width="3"/><text x="1019" y="250" text-anchor="middle" font-family="Arial" font-size="19"><tspan x="1019" dy="0">Moradora: “Já volto.”</tspan></text><text x="969" y="620" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569"><tspan x="969" dy="0">O celular toca; ela sai olhando a</tspan><tspan x="969" dy="25">tela, e a torneira permanece</tspan><tspan x="969" dy="25">aberta.</tspan></text></svg>