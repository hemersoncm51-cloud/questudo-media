<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="28" font-weight="normal" fill="#10233f"><tspan x="600" dy="0">Tirinha sobre uso cotidiano de uma praça pública.</tspan></text><rect x="60" y="105" width="526" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="323" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#10233f"><tspan x="323" dy="0">Quadro 1</tspan></text><circle cx="138" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="138" y1="424" x2="138" y2="535" stroke="#10233f" stroke-width="6"/><line x1="138" y1="455" x2="95" y2="500" stroke="#10233f" stroke-width="5"/><line x1="138" y1="455" x2="180" y2="500" stroke="#10233f" stroke-width="5"/><rect x="185" y="205" width="376" height="190" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M210 395 L190 430 L255 395" fill="white" stroke="#2563eb" stroke-width="3"/><text x="373" y="284" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="373" dy="0">Moradora: “A praça é do nosso</tspan><tspan x="373" dy="23">bairro; por que ela está assim?”</tspan></text><text x="323" y="602" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#475569"><tspan x="323" dy="0">Moradora e servidor conversam diante de uma</tspan><tspan x="323" dy="23">praça com árvores, portão fechado e bancos</tspan><tspan x="323" dy="23">quebrados.</tspan></text><rect x="614" y="105" width="526" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="877" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#10233f"><tspan x="877" dy="0">Quadro 2</tspan></text><circle cx="692" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="692" y1="424" x2="692" y2="535" stroke="#10233f" stroke-width="6"/><line x1="692" y1="455" x2="649" y2="500" stroke="#10233f" stroke-width="5"/><line x1="692" y1="455" x2="734" y2="500" stroke="#10233f" stroke-width="5"/><rect x="739" y="205" width="376" height="190" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M764 395 L744 430 L809 395" fill="white" stroke="#2563eb" stroke-width="3"/><text x="927" y="260" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="927" dy="0">Servidor: “A reforma foi adiada de</tspan><tspan x="927" dy="23">novo.” Moradora: “Então ela é</tspan><tspan x="927" dy="23">nossa no mapa, mas não no dia a</tspan><tspan x="927" dy="23">dia.”</tspan></text><text x="877" y="614" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#475569"><tspan x="877" dy="0">O servidor informa o adiamento da reforma; a</tspan><tspan x="877" dy="23">moradora observa a praça fechada.</tspan></text></svg>