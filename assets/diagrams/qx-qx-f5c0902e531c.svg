<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="600" y="36" text-anchor="middle" font-family="Arial" font-size="28" font-weight="normal" fill="#10233f"><tspan x="600" dy="0">Tirinha autoral sobre o contraste entre uma placa e a</tspan><tspan x="600" dy="31">situação mostrada.</tspan></text><rect x="60" y="105" width="526" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="323" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#10233f"><tspan x="323" dy="0">Quadro 1</tspan></text><circle cx="138" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="138" y1="424" x2="138" y2="535" stroke="#10233f" stroke-width="6"/><line x1="138" y1="455" x2="95" y2="500" stroke="#10233f" stroke-width="5"/><line x1="138" y1="455" x2="180" y2="500" stroke="#10233f" stroke-width="5"/><rect x="185" y="205" width="376" height="190" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M210 395 L190 430 L255 395" fill="white" stroke="#2563eb" stroke-width="3"/><text x="373" y="284" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="373" dy="0">Estudante: “Preciso de um lugar</tspan><tspan x="373" dy="23">silencioso para ler.”</tspan></text><text x="323" y="602" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#475569"><tspan x="323" dy="0">No pátio da escola, uma estudante procura um</tspan><tspan x="323" dy="23">local tranquilo; uma colega aponta para uma</tspan><tspan x="323" dy="23">porta com a placa “Sala do Silêncio”.</tspan></text><rect x="614" y="105" width="526" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="877" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#10233f"><tspan x="877" dy="0">Quadro 2</tspan></text><circle cx="692" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="692" y1="424" x2="692" y2="535" stroke="#10233f" stroke-width="6"/><line x1="692" y1="455" x2="649" y2="500" stroke="#10233f" stroke-width="5"/><line x1="692" y1="455" x2="734" y2="500" stroke="#10233f" stroke-width="5"/><rect x="739" y="205" width="376" height="190" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M764 395 L744 430 L809 395" fill="white" stroke="#2563eb" stroke-width="3"/><text x="927" y="272" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="927" dy="0">Estudante: “Este silêncio está</tspan><tspan x="927" dy="23">fazendo meus pensamentos pedir</tspan><tspan x="927" dy="23">socorro.”</tspan></text><text x="877" y="614" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#475569"><tspan x="877" dy="0">Dentro da sala, um liquidificador e um</tspan><tspan x="877" dy="23">secador estão ligados sobre uma mesa.</tspan></text></svg>