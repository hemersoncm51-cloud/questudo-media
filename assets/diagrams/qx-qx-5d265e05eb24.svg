<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="600" y="36" text-anchor="middle" font-family="Arial" font-size="28" font-weight="normal" fill="#10233f"><tspan x="600" dy="0">As ocorrências de “gentil” e “gentilmente” exercem funções</tspan><tspan x="600" dy="31">distintas nas falas.</tspan></text><rect x="60" y="105" width="526" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="323" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#10233f"><tspan x="323" dy="0">Quadro 1</tspan></text><circle cx="138" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="138" y1="424" x2="138" y2="535" stroke="#10233f" stroke-width="6"/><line x1="138" y1="455" x2="95" y2="500" stroke="#10233f" stroke-width="5"/><line x1="138" y1="455" x2="180" y2="500" stroke="#10233f" stroke-width="5"/><rect x="185" y="205" width="376" height="190" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M210 395 L190 430 L255 395" fill="white" stroke="#2563eb" stroke-width="3"/><text x="373" y="295" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="373" dy="0">Pessoa 1: “Foi um aviso gentil.”</tspan></text><text x="323" y="614" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#475569"><tspan x="323" dy="0">Duas pessoas conversam diante de uma porta</tspan><tspan x="323" dy="23">de atendimento.</tspan></text><rect x="614" y="105" width="526" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="877" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#10233f"><tspan x="877" dy="0">Quadro 2</tspan></text><circle cx="692" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="692" y1="424" x2="692" y2="535" stroke="#10233f" stroke-width="6"/><line x1="692" y1="455" x2="649" y2="500" stroke="#10233f" stroke-width="5"/><line x1="692" y1="455" x2="734" y2="500" stroke="#10233f" stroke-width="5"/><rect x="739" y="205" width="376" height="190" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M764 395 L744 430 L809 395" fill="white" stroke="#2563eb" stroke-width="3"/><text x="927" y="272" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="927" dy="0">Pessoa 2: “Ela respondeu</tspan><tspan x="927" dy="23">gentilmente, mas não aceitou o</tspan><tspan x="927" dy="23">pedido.”</tspan></text><text x="877" y="614" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#475569"><tspan x="877" dy="0">A segunda pessoa segura um formulário e</tspan><tspan x="877" dy="23">responde à primeira.</tspan></text></svg>