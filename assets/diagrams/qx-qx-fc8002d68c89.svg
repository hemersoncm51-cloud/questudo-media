<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="28" font-weight="normal" fill="#10233f"><tspan x="600" dy="0">Formação de chuva de relevo e sombra de chuva.</tspan></text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker></defs><rect x="230" y="115" width="740" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="370" y="175" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#10233f"><tspan x="370" dy="0">Oceano</tspan></text><text x="690" y="164" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#334155"><tspan x="690" dy="0">Origem da massa de ar úmida que se desloca em</tspan><tspan x="690" dy="23">direção ao continente.</tspan></text><line x1="600" y1="235" x2="600" y2="249" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/><text x="780" y="244" text-anchor="middle" font-family="Arial" font-size="14" font-weight="normal" fill="#7c2d12"><tspan x="780" dy="0">ar úmido avança</tspan></text><rect x="230" y="253" width="740" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="370" y="313" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#10233f"><tspan x="370" dy="0">Subida do ar</tspan></text><text x="690" y="302" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#334155"><tspan x="690" dy="0">Na vertente litorânea, o relevo força a elevação</tspan><tspan x="690" dy="23">e o resfriamento do ar.</tspan></text><line x1="600" y1="373" x2="600" y2="387" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/><text x="780" y="382" text-anchor="middle" font-family="Arial" font-size="14" font-weight="normal" fill="#7c2d12"><tspan x="780" dy="0">resfria e condensa</tspan></text><rect x="230" y="391" width="740" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="370" y="451" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#10233f"><tspan x="370" dy="0">Chuva</tspan></text><text x="690" y="440" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#334155"><tspan x="690" dy="0">A condensação produz precipitação antes e</tspan><tspan x="690" dy="23">próximo ao cume.</tspan></text><line x1="600" y1="511" x2="600" y2="525" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/><text x="780" y="520" text-anchor="middle" font-family="Arial" font-size="14" font-weight="normal" fill="#7c2d12"><tspan x="780" dy="0">cruza o relevo</tspan></text><rect x="230" y="529" width="740" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="370" y="589" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#10233f"><tspan x="370" dy="0">Descida do ar</tspan></text><text x="690" y="578" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#334155"><tspan x="690" dy="0">Na vertente interiorana, o ar desce com menor</tspan><tspan x="690" dy="23">disponibilidade de umidade.</tspan></text></svg>