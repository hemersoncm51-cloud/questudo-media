<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="28" font-weight="normal" fill="#10233f"><tspan x="600" dy="0">Tirinha que contrasta as formas “pôde” e “pode”.</tspan></text><rect x="60" y="105" width="526" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="323" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#10233f"><tspan x="323" dy="0">Quadro 1 — Pergunta</tspan></text><circle cx="138" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="138" y1="424" x2="138" y2="535" stroke="#10233f" stroke-width="6"/><line x1="138" y1="455" x2="95" y2="500" stroke="#10233f" stroke-width="5"/><line x1="138" y1="455" x2="180" y2="500" stroke="#10233f" stroke-width="5"/><rect x="185" y="205" width="376" height="190" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M210 395 L190 430 L255 395" fill="white" stroke="#2563eb" stroke-width="3"/><text x="373" y="284" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="373" dy="0">O candidato conseguiu concluir a</tspan><tspan x="373" dy="23">inscrição ontem?</tspan></text><text x="323" y="614" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#475569"><tspan x="323" dy="0">Lara e o colega estão diante de um mural de</tspan><tspan x="323" dy="23">inscrições.</tspan></text><rect x="614" y="105" width="526" height="600" rx="12" fill="#fffdf5" stroke="#10233f" stroke-width="3"/><text x="877" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#10233f"><tspan x="877" dy="0">Quadro 2 — Resposta</tspan></text><circle cx="692" cy="390" r="34" fill="#fed7aa" stroke="#10233f" stroke-width="3"/><line x1="692" y1="424" x2="692" y2="535" stroke="#10233f" stroke-width="6"/><line x1="692" y1="455" x2="649" y2="500" stroke="#10233f" stroke-width="5"/><line x1="692" y1="455" x2="734" y2="500" stroke="#10233f" stroke-width="5"/><rect x="739" y="205" width="376" height="190" rx="30" fill="white" stroke="#2563eb" stroke-width="3"/><path d="M764 395 L744 430 L809 395" fill="white" stroke="#2563eb" stroke-width="3"/><text x="927" y="284" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="927" dy="0">Ele pôde concluir ontem e pode</tspan><tspan x="927" dy="23">corrigir um dado hoje.</tspan></text><text x="877" y="602" text-anchor="middle" font-family="Arial" font-size="17" font-weight="normal" fill="#475569"><tspan x="877" dy="0">O colega aponta para o prazo e para a ficha</tspan><tspan x="877" dy="23">de inscrição no mural; “pôde” e “pode” estão</tspan><tspan x="877" dy="23">destacados.</tspan></text></svg>