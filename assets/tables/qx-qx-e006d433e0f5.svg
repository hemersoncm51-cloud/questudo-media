<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="600" y="36" text-anchor="middle" font-family="Arial" font-size="28" font-weight="normal" fill="#10233f"><tspan x="600" dy="0">Marcas linguísticas em enunciados de uma campanha</tspan><tspan x="600" dy="31">municipal.</tspan></text><rect x="70" y="115" width="265" height="70" fill="#dbeafe" stroke="#64748b"/><text x="202" y="150" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#10233f"><tspan x="202" dy="0">Categoria</tspan></text><rect x="335" y="115" width="265" height="70" fill="#dbeafe" stroke="#64748b"/><text x="468" y="150" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#10233f"><tspan x="468" dy="0">Trecho da campanha</tspan></text><rect x="600" y="115" width="265" height="70" fill="#dbeafe" stroke="#64748b"/><text x="732" y="150" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#10233f"><tspan x="732" dy="0">Marca linguística</tspan></text><rect x="865" y="115" width="265" height="70" fill="#dbeafe" stroke="#64748b"/><text x="998" y="150" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#10233f"><tspan x="998" dy="0">Efeito predominante</tspan></text><rect x="70" y="185" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="202" y="234" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="202" dy="0">Enunciado 1</tspan></text><rect x="335" y="185" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="468" y="210" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="468" dy="0">Separe papel, plástico e</tspan><tspan x="468" dy="23">metal sempre que</tspan><tspan x="468" dy="23">possível.</tspan></text><rect x="600" y="185" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="732" y="234" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="732" dy="0">sempre que possível</tspan></text><rect x="865" y="185" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="998" y="222" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="998" dy="0">Orientação adaptada às</tspan><tspan x="998" dy="23">condições do morador.</tspan></text><rect x="70" y="282" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="202" y="330" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="202" dy="0">Enunciado 2</tspan></text><rect x="335" y="282" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="468" y="308" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="468" dy="0">Com a colaboração do</tspan><tspan x="468" dy="23">bairro, as ruas podem</tspan><tspan x="468" dy="23">permanecer limpas.</tspan></text><rect x="600" y="282" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="732" y="330" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="732" dy="0">podem</tspan></text><rect x="865" y="282" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="998" y="319" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="998" dy="0">Possibilidade ligada à</tspan><tspan x="998" dy="23">participação coletiva.</tspan></text><rect x="70" y="379" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="202" y="428" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="202" dy="0">Enunciado 3</tspan></text><rect x="335" y="379" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="468" y="404" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="468" dy="0">Se o lixo ficar nas bocas</tspan><tspan x="468" dy="23">de lobo, o risco de</tspan><tspan x="468" dy="23">alagamento aumenta.</tspan></text><rect x="600" y="379" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="732" y="428" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="732" dy="0">se</tspan></text><rect x="865" y="379" width="265" height="97" fill="white" stroke="#94a3b8"/><text x="998" y="416" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="998" dy="0">Advertência condicional</tspan><tspan x="998" dy="23">sobre uma consequência.</tspan></text></svg>