<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/><text x="600" y="36" text-anchor="middle" font-family="Arial" font-size="28" font-weight="normal" fill="#10233f"><tspan x="600" dy="0">Marcos institucionais em períodos da história republicana</tspan><tspan x="600" dy="31">brasileira.</tspan></text><rect x="70" y="115" width="353" height="70" fill="#dbeafe" stroke="#64748b"/><text x="247" y="150" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#10233f"><tspan x="247" dy="0">Categoria</tspan></text><rect x="423" y="115" width="353" height="70" fill="#dbeafe" stroke="#64748b"/><text x="600" y="150" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#10233f"><tspan x="600" dy="0">Característica política</tspan></text><rect x="777" y="115" width="353" height="70" fill="#dbeafe" stroke="#64748b"/><text x="953" y="150" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#10233f"><tspan x="953" dy="0">Marco institucional</tspan></text><rect x="70" y="185" width="353" height="74" fill="white" stroke="#94a3b8"/><text x="247" y="222" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="247" dy="0">República Velha (1889-1930)</tspan></text><rect x="423" y="185" width="353" height="74" fill="white" stroke="#94a3b8"/><text x="600" y="210" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="600" dy="0">Predomínio das oligarquias</tspan><tspan x="600" dy="23">estaduais</tspan></text><rect x="777" y="185" width="353" height="74" fill="white" stroke="#94a3b8"/><text x="953" y="222" text-anchor="middle" font-family="Arial" font-size="18" font-weight="normal" fill="#10233f"><tspan x="953" dy="0">Constituição de 1891</tspan></text><rect x="70" y="259" width="353" height="74" fill="white" stroke="#94a3b8"/><text x="2